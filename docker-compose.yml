services:
  db:
    image: postgres:16-alpine
    container_name: barberly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberly
      POSTGRES_PASSWORD: barberly
      POSTGRES_DB: barberly
    ports:
      - "5432:5432"
    volumes:
      - barberly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberly -d barberly"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberly-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://barberly:barberly@db:5432/barberly?schema=public

volumes:
  barberly-db-data:
