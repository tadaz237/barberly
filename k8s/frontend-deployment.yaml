apiVersion: apps/v1
kind: Deployment
metadata:
  name: coiffure-mvp-frontend
  labels:
    app: coiffure-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coiffure-mvp
  template:
    metadata:
      labels:
        app: coiffure-mvp
    spec:
      containers:
        - name: frontend
          image: ghcr.io/owner/coiffure-mvp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20